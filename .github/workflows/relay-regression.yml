name: Relay regression

on:
  push:
    branches: [fix/relay-fallback]
  pull_request:
    paths:
      - src/main.rs
      - src/webrtc.rs
      - src/webrtc_lifecycle_tests.rs
      - src/relay.rs
      - src/relay_session.rs
      - src/signaling.rs
      - src/test_network.rs
      - src/session_ice.rs
      - src/viewer_main.rs
      - src/viewer/**
      - vendor/webrtc-ice/**
      - vendor/webrtc/src/peer_connection/sdp/**
      - .github/workflows/relay-regression.yml
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxext-dev libxtst-dev libxfixes-dev libgtk-3-dev libsdl2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      # Dependency unit tests are not run by the root package's cargo test.
      - run: cargo test --manifest-path vendor/webrtc-ice/Cargo.toml --lib relay_switch_tests
      - name: Linux controller relay regression and existing viewer tests
        run: cargo test --locked --features native-viewer --bin uuremote-viewer -- --test-threads=1
      - name: Build Linux desktop controller
        run: cargo build --locked --features native-viewer,viewer-sdl --bin uuremote-viewer
